name: tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  core-stdlib-only:
    # The core must work with only the standard library: no optional packages installed.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Unit and integration tests (no optional packages)
        run: python -m unittest discover -s tests -t . -v
      - name: Offline eval (scripted playbooks, no model)
        run: python -m analyst_agent eval

  with-optional-packages:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install optional packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright openpyxl pyyaml
          python -m playwright install chromium
      - name: Unit, integration and browser tests
        run: python -m unittest discover -s tests -t . -v
